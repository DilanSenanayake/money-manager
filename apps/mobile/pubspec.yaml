name: ledgerly
description: Ledgerly — native money manager for Android and iOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  fl_chart: ^0.71.0
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  uuid: ^4.5.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: assets/icons/app_icon.png
